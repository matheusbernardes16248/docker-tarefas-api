services:
  api:
    build: .
    image: docker-tarefas-api
    container_name: tarefas-api
    init: true
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - tarefas-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  tarefas-data:
